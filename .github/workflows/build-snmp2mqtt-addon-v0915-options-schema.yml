name: Build SNMP2MQTT Add-on v0.9.15 Options schema hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hotfix/snmp2mqtt-addon-0.9.15-options-schema' }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - switch-vision
      - sv-dev
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prepare changelog and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          changelog_path = root / 'switch-vision-snmp2mqtt/CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''## 0.9.15\n\n- Restore the Home Assistant app `schema:` for the existing MQTT, manual-target, generated-YAML import, imported-target and backup options so Supervisor renders the Configuration/Options controls again.\n- Add explicit defaults for optional MQTT host/username/password and `backup_existing_config` while preserving automatic Supervisor MQTT resolution when the host is blank.\n- Keep Switch Vision SNMP2MQTT Core pinned to `v0.9.13` at `bc8bd1a057b21bc7f779325222a971130da3839e`; runtime polling and generated-YAML recovery behavior are unchanged from 0.9.14.\n- Add permanent cutover checks requiring the Options schema and visible wrapper-owned fields.\n\n'''
          if changelog.startswith('# Changelog\n\n'):
              changelog = '# Changelog\n\n' + entry + changelog[len('# Changelog\n\n'):]
          else:
              raise SystemExit('ERROR: unexpected Add-on changelog header')
          changelog_path.write_text(changelog, encoding='utf-8', newline='\n')

          test_path = root / 'tests/validate-cutover.sh'
          test = test_path.read_text(encoding='utf-8')
          old = "grep -q '^version: 0.9.14$' \"$ROOT/switch-vision-snmp2mqtt/config.yaml\""
          new = "grep -q '^version: 0.9.15$' \"$ROOT/switch-vision-snmp2mqtt/config.yaml\""
          if old not in test:
              raise SystemExit('ERROR: expected 0.9.14 cutover version assertion not found')
          test = test.replace(old, new, 1)
          marker = new + '\n'
          schema_checks = '''grep -q '^schema:$' "$ROOT/switch-vision-snmp2mqtt/config.yaml"\ngrep -q '^  mqtt:$' "$ROOT/switch-vision-snmp2mqtt/config.yaml"\ngrep -Fq '    host: str?' "$ROOT/switch-vision-snmp2mqtt/config.yaml"\ngrep -Fq '    password: password?' "$ROOT/switch-vision-snmp2mqtt/config.yaml"\ngrep -q '^  use_switch_vision_generated_yaml: bool$' "$ROOT/switch-vision-snmp2mqtt/config.yaml"\ngrep -q '^  backup_existing_config: bool$' "$ROOT/switch-vision-snmp2mqtt/config.yaml"\ngrep -q '^  backup_existing_config: false$' "$ROOT/switch-vision-snmp2mqtt/config.yaml"\n'''
          if 'backup_existing_config: bool' not in test:
              test = test.replace(marker, marker + schema_checks, 1)
          test_path.write_text(test, encoding='utf-8', newline='\n')
          PY

      - name: Validate Add-on 0.9.15 configuration and wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML
          bash -n switch-vision-snmp2mqtt/run.sh
          sh tests/validate-cutover.sh
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path('switch-vision-snmp2mqtt/config.yaml').read_text())
          assert str(cfg['version']) == '0.9.15'
          options = cfg.get('options') or {}
          schema = cfg.get('schema') or {}
          assert isinstance(schema, dict) and schema
          for key in (
              'mqtt',
              'targets_path',
              'use_switch_vision_generated_yaml',
              'switch_vision_generated_yaml_path',
              'imported_targets_path',
              'backup_existing_config',
          ):
              assert key in options, f'missing option {key}'
              assert key in schema, f'missing schema {key}'
          assert options['mqtt']['host'] == ''
          assert options['mqtt']['port'] == 1883
          assert options['backup_existing_config'] is False
          print('SNMP2MQTT Add-on 0.9.15 Options schema contract: PASS')
          PY
          git diff --check

      - name: Remove temporary builder and generated caches
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-snmp2mqtt-addon-v0915-options-schema.yml
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check

      - name: Commit Add-on 0.9.15 source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'ERROR: Add-on 0.9.15 builder produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SNMP2MQTT Add-on v0.9.15: restore Options schema'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

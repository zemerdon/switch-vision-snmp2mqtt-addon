name: Build SNMP2MQTT Add-on v0.9.15 Options schema hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'hotfix/snmp2mqtt-addon-0.9.15-options-schema' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare Add-on 0.9.15
        run: python3 tools/prepare_addon_v0915.py
      - name: Validate Add-on 0.9.15
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML
          bash -n switch-vision-snmp2mqtt/run.sh
          sh tests/validate-cutover.sh
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          cfg=yaml.safe_load(Path('switch-vision-snmp2mqtt/config.yaml').read_text())
          assert str(cfg['version'])=='0.9.15'
          options=cfg.get('options') or {}
          schema=cfg.get('schema') or {}
          for key in ('mqtt','targets_path','use_switch_vision_generated_yaml','switch_vision_generated_yaml_path','imported_targets_path','backup_existing_config'):
              assert key in options, f'missing option {key}'
              assert key in schema, f'missing schema {key}'
          assert options['mqtt']['host']==''
          assert options['mqtt']['port']==1883
          assert options['backup_existing_config'] is False
          print('SNMP2MQTT Add-on 0.9.15 Options schema contract: PASS')
          PY
          git diff --check
      - name: Remove temporary builder and helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-snmp2mqtt-addon-v0915-options-schema.yml tools/prepare_addon_v0915.py
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
      - name: Commit Add-on 0.9.15 source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'ERROR: Add-on 0.9.15 builder produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'SNMP2MQTT Add-on v0.9.15: restore Options schema'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Build Switch Vision Add-on

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate repository cutover and runtime wrapper
        run: sh tests/validate-cutover.sh

      - name: Read app metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2; exit}' switch-vision-snmp2mqtt/config.yaml)"
          if [[ -z "${version}" ]]; then
            echo "Unable to read version from config.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./switch-vision-snmp2mqtt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/zemerdon/switch-vision-snmp2mqtt-addon:${{ steps.metadata.outputs.version }}
            ghcr.io/zemerdon/switch-vision-snmp2mqtt-addon:latest
          build-args: |
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_NAME=Switch Vision SNMP2MQTT
            BUILD_DESCRIPTION=Switch Vision SNMP to MQTT bridge for Home Assistant
            BUILD_REPOSITORY=zemerdon/switch-vision-snmp2mqtt-addon
            BUILD_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            CORE_VERSION=v0.9.12
            CORE_COMMIT=e9a961f25fd3eb205321d8494c596911fa97fc49
            CACHE_BUST=core-v0.9.12-${{ github.run_id }}-${{ github.run_attempt }}

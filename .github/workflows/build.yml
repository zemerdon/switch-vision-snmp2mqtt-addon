name: Build Switch Vision Add-on

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build multi-arch image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_date: ${{ steps.metadata.outputs.build_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate repository cutover and runtime wrapper
        run: sh tests/validate-cutover.sh

      - name: Validate release transport contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path('.github/workflows/build.yml').read_text(encoding='utf-8')
          publisher = Path('.github/workflows/publish-release.yml').read_text(encoding='utf-8')

          forbidden = (
              (r'^\s+packages:\s*write\s*$', 'packages: write'),
              (r'^\s+push:\s*true\s*$', 'push: true'),
              (r'^\s+- name:\s*Log in to GHCR\s*$', 'Log in to GHCR'),
          )
          for pattern, label in forbidden:
              if re.search(pattern, build, re.MULTILINE):
                  raise SystemExit(f'automatic publication capability remains in build.yml: {label}')

          required = (
              "startsWith(github.event.pull_request.head.ref, 'release/snmp2mqtt-addon-')",
              '.sv-release-request.json',
              'TARGET_SHA',
              'BASE_SHA',
              'packages: write',
              'push: true',
              'BUILD_REF=${{ needs.preflight.outputs.target_sha }}',
          )
          for token in required:
              if token not in publisher:
                  raise SystemExit(f'SNMP2MQTT release transport contract missing: {token}')
          print('SNMP2MQTT release transport static contract: PASS')
          PY

      - name: Read app metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2; exit}' switch-vision-snmp2mqtt/config.yaml)"
          if [[ -z "${version}" ]]; then
            echo "Unable to read version from config.yaml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./switch-vision-snmp2mqtt
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ghcr.io/zemerdon/switch-vision-snmp2mqtt-addon:${{ steps.metadata.outputs.version }}
            ghcr.io/zemerdon/switch-vision-snmp2mqtt-addon:latest
          build-args: |
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_NAME=Switch Vision SNMP2MQTT
            BUILD_DESCRIPTION=Switch Vision SNMP to MQTT bridge for Home Assistant
            BUILD_REPOSITORY=zemerdon/switch-vision-snmp2mqtt-addon
            BUILD_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            CORE_VERSION=v0.9.13
            CORE_COMMIT=bc8bd1a057b21bc7f779325222a971130da3839e
            CACHE_BUST=core-v0.9.13-${{ github.run_id }}-${{ github.run_attempt }}

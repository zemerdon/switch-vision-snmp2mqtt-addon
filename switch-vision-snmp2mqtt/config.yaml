---
name: Switch Vision SNMP2MQTT
version: 0.9.14
slug: switch_vision_snmp2mqtt
description: Switch Vision SNMP to MQTT bridge with Discovery generated YAML import
  and Juniper EX VLAN/trunk support
url: https://github.com/zemerdon/switch-vision-snmp2mqtt
arch:
- amd64
- aarch64
image: ghcr.io/zemerdon/switch-vision-snmp2mqtt-addon
startup: application
boot: auto
init: false
map:
- config:rw
- share:rw
- ssl:ro
services:
- mqtt:need
homeassistant: 2026.7.1
panel_icon: mdi:cog-transfer-outline
panel_title: Switch Vision SNMP2MQTT
options:
  mqtt:
    port: 1883
  targets_path: /config/app_configs/switch_vision_snmp2mqtt/targets.yaml
  use_switch_vision_generated_yaml: true
  switch_vision_generated_yaml_path: /share/switch_vision/generated-snmp2mqtt.yaml
  imported_targets_path: /config/app_configs/switch_vision_snmp2mqtt/imported/generated-snmp2mqtt.yaml
